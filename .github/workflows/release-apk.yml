name: Release APK

on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - ".github/workflows/release-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR=missing signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/tapboard-upload.jks
          printf 'storeFile=tapboard-upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --quiet

      - name: Stage TapBoard.apk
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/TapBoard.apk
          ls -la dist/TapBoard.apk

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.0
        run: |
          NOTES="$(cat <<'EOF'
          ## TapBoard (Bluetooth only)

          - `TapBoard.apk` — Android Bluetooth keyboard and mouse

          Pair your phone as a Bluetooth keyboard/mouse. No Windows companion or Wi-Fi mode.

          Built automatically from `master` via GitHub Actions.
          EOF
          )"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "TapBoard $TAG" --notes "$NOTES" --latest
          fi
          gh release delete-asset "$TAG" tapboard-companion.exe --yes 2>/dev/null || true
          gh release upload "$TAG" dist/TapBoard.apk --clobber
          gh release edit "$TAG" --notes "$NOTES"
          echo "APK=https://github.com/${{ github.repository }}/releases/latest/download/TapBoard.apk"
